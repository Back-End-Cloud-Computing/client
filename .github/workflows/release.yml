name: Publish multi-architecture image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag (for example 1.2.0)
        required: true
        default: '1.2.0'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: '[[ "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: eduardofabri/client:${{ inputs.tag }}
      - name: Inspect published platforms
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: docker buildx imagetools inspect "eduardofabri/client:$IMAGE_TAG"
